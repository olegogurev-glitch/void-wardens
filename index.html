<body>
  <div id="app">
    <header class="hud">
      <div class="brand"><span class="brand-mark"></span><span class="brand-text">VOID<i>//</i><b>WARDENS</b></span></div>
      <div class="stats">
        <div class="stat"><label data-t>Wave</label><span class="val"><b id="wave-num">0</b><small>/<span id="wave-total">10</span></small></span></div>
        <div class="stat credits" id="stat-credits"><label data-t>Credits</label><span class="val"><i class="cr"></i><span id="credits">0</span></span></div>
        <div class="stat core" id="stat-lives"><label data-t>Core</label><span class="val"><span id="lives">20</span><i class="bar"><i id="lives-bar"></i></i></span></div>
        <div class="stat score" id="stat-score" hidden><label data-t>Score</label><span class="val" id="score">0</span></div>
      </div>
      <div class="controls">
        <button id="btn-speed" class="ctrl" title="Game speed (F)" data-t-title="Game speed (F)">1×</button>
        <button id="btn-pause" class="ctrl" title="Pause (P)" aria-label="Pause" data-t-title="Pause (P)" data-t-label="Pause">
          <svg viewBox="0 0 16 16" width="13" height="13"><rect x="3" y="2" width="3.5" height="12" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"/></svg>
        </button>
        <button id="btn-music" class="ctrl" title="Music (N)" aria-label="Toggle music" data-t-title="Music (N)" data-t-label="Toggle music">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M6 3l8-1.5v9.2a2.2 2.2 0 1 1-1.5-2.1V4.3L7.5 5.2v7.5A2.2 2.2 0 1 1 6 10.6z" fill="currentColor"/><path class="x" d="M2 2l12 12" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button id="btn-mute" class="ctrl" title="Sound (M)" aria-label="Toggle sound" data-t-title="Sound (M)" data-t-label="Toggle sound">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor"/><path class="wave" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.5a6 6 0 0 1 0 9" stroke="currentColor" stroke-width="1.4" fill="none"/><path class="x" d="M11 6l4 4M15 6l-4 4" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>
    </header>

    <main id="stage">
      <div id="viewport">
        <canvas id="game"></canvas>
        <div id="banner" class="banner"></div>
        <div id="wave-cta" class="wave-cta"></div>
        <div id="panel" class="panel hudbox" hidden></div>
        <div id="overlay" class="overlay"></div>
      </div>
    </main>

    <footer id="dock" class="dock"></footer>
  </div>
  <div id="tooltip" class="tooltip hudbox" hidden></div>
  <div id="rotate" class="rotate" aria-live="polite">
    <div class="rot-phone"><i></i></div>
    <div class="rot-title" data-t>Rotate to landscape</div>
    <div class="rot-sub" data-t>The grid needs the full width — turn your device sideways.</div>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Void Wardens · Pixo</title>
  <meta name="description" content="Void Wardens — a cyber-grid tower defense game. Evolve your defenses and keep hostile code away from the Core.">
  <meta name="theme-color" content="#03050a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="hud">
      <div class="brand"><span class="brand-mark"></span><span class="brand-text">VOID<i>//</i><b>WARDENS</b></span></div>
      <div class="stats">
        <div class="stat"><label>Wave</label><span class="val"><b id="wave-num">0</b><small>/<span id="wave-total">10</span></small></span></div>
        <div class="stat credits" id="stat-credits"><label>Credits</label><span class="val"><i class="cr"></i><span id="credits">0</span></span></div>
        <div class="stat core" id="stat-lives"><label>Core</label><span class="val"><span id="lives">20</span><i class="bar"><i id="lives-bar"></i></i></span></div>
      </div>
      <div class="controls">
        <button id="btn-speed" class="ctrl" title="Game speed (F)">1×</button>
        <button id="btn-pause" class="ctrl" title="Pause (P)" aria-label="Pause">
          <svg viewBox="0 0 16 16" width="13" height="13"><rect x="3" y="2" width="3.5" height="12" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"/></svg>
        </button>
        <button id="btn-mute" class="ctrl" title="Sound (M)" aria-label="Toggle sound">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor"/><path class="wave" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.5a6 6 0 0 1 0 9" stroke="currentColor" stroke-width="1.4" fill="none"/><path class="x" d="M11 6l4 4M15 6l-4 4" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>
    </header>

    <main id="stage">
      <div id="viewport">
        <canvas id="game"></canvas>
        <div id="banner" class="banner"></div>
        <div id="wave-cta" class="wave-cta"></div>
        <div id="panel" class="panel hudbox" hidden></div>
        <div id="overlay" class="overlay"></div>
      </div>
    </main>

    <footer id="dock" class="dock"></footer>
  </div>
  <div id="tooltip" class="tooltip hudbox" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
